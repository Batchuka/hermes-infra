services:
  mongo:
    image: mongo:7
    container_name: hermes-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mysql:
    image: mysql:8.4
    container_name: hermes-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: hermes
      MYSQL_DATABASE: credit
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro

volumes:
  mongo-data:
  mysql-data:
